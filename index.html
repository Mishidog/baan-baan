<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Coming Summer 2027.">
  <meta name="theme-color" content="#7d6553">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Baan Baan Farmer's Table">
  <meta property="og:description" content="Coming Summer 2027.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Baan Baan Farmer's Table">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Baan Baan Farmer's Table">
  <meta name="twitter:description" content="Coming Summer 2027.">
  <meta name="twitter:image" content="/og.jpg">
  <meta name="twitter:image:alt" content="Baan Baan Farmer's Table">
  <style>
    @font-face {
      font-family: Outfit;
      src: url("fonts/outfit-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html {
      color-scheme: dark;
      background: #7d6553;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #7d6553;
      background-image: url("texture.webp");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: #f6f1ea;
      font-family: Outfit, "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    main {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 42rem);
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-right: max(1.25rem, env(safe-area-inset-right));
      padding-bottom: max(1.15rem, env(safe-area-inset-bottom));
      padding-left: max(1.25rem, env(safe-area-inset-left));
    }

    h1 {
      margin: 0;
      font: inherit;
      line-height: 0;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(74vw, 24rem);
      max-height: calc(100dvh - 8.75rem);
    }

    p {
      width: min(36rem, 92vw);
      margin: clamp(0.85rem, 2.4vh, 1.65rem) 0 0;
      padding: 0.85rem 0 0.95rem;
      font-size: clamp(1rem, 2.8vw, 1.125rem);
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      text-align: center;
      color: #f6f1ea;
      background: radial-gradient(
        ellipse 62% 100% at 50% 50%,
        rgba(26, 14, 10, 0.84) 0%,
        rgba(26, 14, 10, 0.42) 46%,
        rgba(26, 14, 10, 0) 72%
      );
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <img
        src="logo.png"
        width="1365"
        height="1718"
        alt="Baan Baan Farmer's Table"
        fetchpriority="high"
      >
    </h1>
    <p>Coming Summer 2027</p>
  </main>
</body>
</html>
