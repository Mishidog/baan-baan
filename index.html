<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baan Baan Farmer's Table</title>
  <meta name="description" content="Coming Summer 2027.">
  <link rel="canonical" href="https://www.baanbaan.ca/">
  <meta name="theme-color" content="#7d6553">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Baan Baan Farmer's Table">
  <meta property="og:description" content="Coming Summer 2027.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.baanbaan.ca/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Baan Baan Farmer's Table">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Baan Baan Farmer's Table">
  <meta name="twitter:description" content="Coming Summer 2027.">
  <meta name="twitter:image" content="https://www.baanbaan.ca/og.jpg">
  <meta name="twitter:image:alt" content="Baan Baan Farmer's Table">
  <style>
    @font-face {
      font-family: Outfit;
      src: url("fonts/outfit-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html {
      color-scheme: dark;
      background: #7d6553;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #7d6553;
      background-image: url("texture.webp");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: #f6f1ea;
      font-family: Outfit, "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    main {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 42rem);
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-right: max(1.25rem, env(safe-area-inset-right));
      padding-bottom: max(1.15rem, env(safe-area-inset-bottom));
      padding-left: max(1.25rem, env(safe-area-inset-left));
    }

    h1 {
      margin: 0;
      font: inherit;
      line-height: 0;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(74vw, 24rem);
      max-height: calc(100dvh - 14rem);
    }

    .panel {
      width: min(36rem, 92vw);
      margin: clamp(0.85rem, 2.4vh, 1.65rem) 0 0;
      padding: 0.85rem 0.75rem 1rem;
      text-align: center;
      background: radial-gradient(
        ellipse 92% 100% at 50% 42%,
        rgba(26, 14, 10, 0.88) 0%,
        rgba(26, 14, 10, 0.62) 58%,
        rgba(26, 14, 10, 0) 80%
      );
    }

    .opening {
      margin: 0;
      font-size: clamp(1rem, 2.8vw, 1.125rem);
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      color: #f6f1ea;
    }

    .contact {
      margin: 0.8rem 0 0;
      padding: 0.75rem 0 0;
      font-style: normal;
      font-size: clamp(0.8125rem, 2.4vw, 0.9375rem);
      line-height: 1.55;
      letter-spacing: 0.04em;
      text-indent: 0;
      color: #f6f1ea;
      background: linear-gradient(#f6f1ea, #f6f1ea) center top / 2.25rem 1px no-repeat;
    }

    .contact p {
      margin: 0;
      padding: 0.06rem 0;
      text-indent: 0.04em;
    }

    .contact a {
      display: inline-block;
      margin: -0.28rem -0.12rem;
      padding: 0.28rem 0.12rem;
      color: inherit;
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
      border-radius: 2px;
    }

    .contact a:hover {
      color: #fff;
      text-decoration-thickness: 2px;
    }

    .contact a:focus-visible {
      outline: 2px solid #f6f1ea;
      outline-offset: 3px;
    }

    @media (prefers-reduced-transparency: reduce) {
      .panel {
        background: #1a0e0a;
      }
    }

    @media (forced-colors: active) {
      body {
        background-image: none;
        background-color: Canvas;
        color: CanvasText;
      }

      .panel {
        background: Canvas;
      }

      .opening,
      .contact,
      .contact a {
        color: CanvasText;
      }

      .contact {
        background: none;
        border-top: 1px solid CanvasText;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <img
        src="logo.png"
        width="1365"
        height="1718"
        alt="Baan Baan Farmer's Table"
        fetchpriority="high"
      >
    </h1>
    <div class="panel">
      <p class="opening">Coming Summer 2027</p>
      <address class="contact">
        <p>Baan Baan: 1451 and 1443 Anderson Street</p>
        <p>Le KaNom: 1450 Anderson Street</p>
        <p>Email: <a href="mailto:info@baanlao.ca">info@baanlao.ca</a></p>
      </address>
    </div>
  </main>
</body>
</html>
